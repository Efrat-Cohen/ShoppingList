# Everything the assignment needs, in one file. `docker compose up --build` is the only
# command a reviewer has to run - both databases seed themselves on first start.
#
#   browser -> frontend (nginx) -> bff -> catalogService (.NET/SQL Server)
#                                      -> ordersService  (Node/Elasticsearch)
#
# The two services are not published to the host: the BFF is the single entry point. Each
# service folder has its own docker-compose.yml if you want to poke at one directly.
name: shopping-list

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Str0ng.Passw0rd"
      MSSQL_PID: Developer
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1"
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.2
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      # Small heap on purpose: this is a demo index with a handful of documents.
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test:
        - CMD-SHELL
        - curl -fsS http://localhost:9200/_cluster/health > /dev/null
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  catalog-service:
    build: ./catalogService
    environment:
      ConnectionStrings__Catalog: "Server=sqlserver,1433;Database=ShopCatalog;User Id=sa;Password=Str0ng.Passw0rd;TrustServerCertificate=True;Encrypt=False"
    depends_on:
      sqlserver:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - curl -fsS http://localhost:8080/health > /dev/null
      interval: 5s
      timeout: 3s
      retries: 40
      start_period: 20s

  orders-service:
    build: ./ordersService
    environment:
      ELASTICSEARCH_URL: http://elasticsearch:9200
      PORT: "4000"
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:4000/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  bff:
    build: ./bff
    environment:
      CATALOG_SERVICE_URL: http://catalog-service:8080
      ORDERS_SERVICE_URL: http://orders-service:4000
      PORT: "4100"
    ports:
      - "4100:4100"
    depends_on:
      catalog-service:
        condition: service_healthy
      orders-service:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:4100/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      bff:
        condition: service_healthy

volumes:
  sqlserver-data:
  elasticsearch-data:
