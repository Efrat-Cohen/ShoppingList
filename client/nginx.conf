server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # One origin for the browser: the two APIs are reached through this server, so the
    # client never deals with CORS. Vite's dev proxy mirrors these two rules.
    location /api/catalog/ {
        proxy_pass http://catalog-api:8080/api/;
    }

    location /api/orders {
        proxy_pass http://orders-api:4000;
    }

    # Single page app - /summary has to survive a refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
