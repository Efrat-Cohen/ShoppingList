# Runs this service on its own, without the rest of the system.
# The full stack lives in the docker-compose.yml one level up.
name: catalog-api

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Str0ng.Passw0rd"
      MSSQL_PID: Developer
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1"
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  catalog-api:
    build: .
    environment:
      ConnectionStrings__Catalog: "Server=sqlserver,1433;Database=ShopCatalog;User Id=sa;Password=Str0ng.Passw0rd;TrustServerCertificate=True;Encrypt=False"
    ports:
      - "5080:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - curl -fsS http://localhost:8080/health > /dev/null
      interval: 5s
      timeout: 3s
      retries: 40
      start_period: 20s

volumes:
  sqlserver-data:
