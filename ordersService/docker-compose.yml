# Runs this service on its own, without the rest of the system.
# The full stack lives in the docker-compose.yml one level up.
name: orders-service

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.2
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test:
        - CMD-SHELL
        - curl -fsS http://localhost:9200/_cluster/health > /dev/null
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  orders-service:
    build: .
    environment:
      ELASTICSEARCH_URL: http://elasticsearch:9200
      PORT: "4000"
    ports:
      - "4000:4000"
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:4000/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

volumes:
  elasticsearch-data:
