server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # The browser only ever talks to the BFF, which is the single entry point in front of
    # the catalog and orders services. Vite's dev server mirrors this one rule.
    location /api/ {
        proxy_pass http://bff:4100;
    }

    # Single page app - /summary has to survive a refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
