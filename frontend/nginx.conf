server {
    # 8080 rather than 80: this runs on the unprivileged nginx image, which never has root to
    # bind a privileged port with. Compose still publishes it to the host as 3000.
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # The browser only ever talks to the BFF, which is the single entry point in front of
    # the catalog and orders services. Vite's dev server mirrors this one rule.
    location /api/ {
        proxy_pass http://bff:4100;

        # Without these every request reaches the BFF wearing this container's address, and
        # its rate limiter counts one client's burst against everybody.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Single page app - /summary has to survive a refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
